name: Verificación de Android y Play Protect

on:
  push:
    branches: [main]
    paths:
      - user-android.json
      - SHA256SUMS
      - 'TierTube-*-usuario.apk'
      - .github/workflows/android-release-check.yml
      - .github/scripts/android-release-check.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'lionelvidal300-tech/tiertube-actualizaciones-usuarios'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verificar APK y consultar VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_SUBMIT_PUBLIC_APK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$build_tools/apksigner" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
          python3 .github/scripts/android-release-check.py "$build_tools" release-check

      - name: Guardar informe y datos de apelación
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comprobacion-android
          path: release-check/
          if-no-files-found: ignore
